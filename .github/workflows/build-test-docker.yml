name: CI + Docker image

# Triggers:
# - push on main and version tags: run tests + build/push image
# - pull_request on main: run tests only
# - schedule: monthly run (UTC)
on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:
    branches: [ main ]
  schedule:
    # At 03:17 UTC on day-of-month 1.
    - cron: '17 3 1 * *'

jobs:
  # Fast CI gate: run Go tests before any image build/push.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Use the exact version declared in go.mod to keep CI and code aligned.
          go-version-file: go.mod

      - name: Run tests
        run: |
          go test ./... -v

  # Docker packaging job:
  # - waits for tests to pass
  # - runs on push and scheduled events (not on pull requests)
  docker:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      # Required to pull source and push image to GHCR.
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize registry owner to lowercase
        id: vars
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # push=true because this job only runs on push events.
          push: true
          # Publish multi-arch image.
          platforms: linux/amd64,linux/arm64
          # Keep a single moving tag; older GHCR versions are cleaned up below.
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/porttrap:latest
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/porttrap:${{ github.ref_name }}

      - name: Delete old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: porttrap
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
