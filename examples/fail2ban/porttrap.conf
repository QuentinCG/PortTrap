[Definition]
# Fail2Ban filter for PortTrap
# Supports both text lines like:
# 2026-08-18T09:42:10Z TCP 185.12.34.56:42137 -> 6379
# and JSON lines like:
# {"timestamp":"...","protocol":"tcp","source_ip":"185.12.34.56","source_port":42137,"destination_port":6379}

failregex = ^%(__prefix_line)sTCP\s+<HOST>:\d+\s+->\s+\d+$
		   ^%(__prefix_line)sUDP\s+<HOST>:\d+\s+->\s+\d+$
		   ^\{.*"protocol"\s*:\s*"(?:tcp|udp)".*"source_ip"\s*:\s*"(?P<host>[^"}]+)".*\}$

ignoreregex =
